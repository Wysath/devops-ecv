name: Update Dynamic Badge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compter les workflows
        id: count
        run: |
          COUNT=$(ls .github/workflows/*.yml | wc -l)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Mettre à jour le badge dynamique dans le README
        run: |
          COUNT=${{ steps.count.outputs.count }}
          sed -i "s|workflows-[0-9]*-blue|workflows-${COUNT}-blue|g" README.md

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: mise à jour badge nombre de workflows [skip ci]"
          git push
